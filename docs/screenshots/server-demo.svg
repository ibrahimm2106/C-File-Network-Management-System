<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420" role="img" aria-label="Server terminal demo">
  <rect width="1100" height="420" fill="#0d1117" rx="18"/>
  <rect x="0" y="0" width="1100" height="44" fill="#161b22" rx="18"/>
  <circle cx="28" cy="22" r="7" fill="#ff5f56"/>
  <circle cx="52" cy="22" r="7" fill="#ffbd2e"/>
  <circle cx="76" cy="22" r="7" fill="#27c93f"/>
  <text x="550" y="28" text-anchor="middle" fill="#c9d1d9" font-size="18" font-family="Consolas, Menlo, monospace">server terminal</text>
  <g fill="#c9d1d9" font-size="23" font-family="Consolas, Menlo, monospace" xml:space="preserve">
    <text x="30" y="90">PS C:\Users\User\Documents\FileManagementSystem&gt; .\server.exe</text>
    <text x="30" y="138">Initialising Winsock...</text>
    <text x="30" y="182">Server is running.</text>
    <text x="30" y="226">Listening on port 8080...</text>
    <text x="30" y="270">Waiting for file...</text>
    <text x="30" y="314">Client connected.</text>
    <text x="30" y="358">File received successfully. Saved as received_file.txt</text>
  </g>
</svg>
